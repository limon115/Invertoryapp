# Architected by Khalid Hasan Limon
name: Polwel ERP Cloud Compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Enterprise APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Compose)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Cloud Wrapper Dynamically
        run: gradle wrapper

      - name: 🔐 Forge Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Grant Exec Permissions
        run: chmod +x gradlew || true

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Upload ERP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolwelERP-APK
          path: app/build/outputs/apk/debug/*.apk
